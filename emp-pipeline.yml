name: 従業員数パイプライン（年金機構取得 → GAS判定）

# 未実行分がゼロになるまで自動で回り続ける。
#  - 1) emp_fetch_local.js が年金機構を検索し「従業員数キャッシュ」へ投入（GASからは403のためローカル相当の実行が必要）
#  - 2) GAS web API（action=emp）がキャッシュを使って判定・書き込みプレビューへ（dryrun＝HS書込なし）
# 状態（emp_cache_local.json / emp_fetch_state.json）は actions/cache で引き継ぐ。

on:
  schedule:
    - cron: '0 */2 * * *'   # 2時間ごと（日本時間9:00, 11:00, ... = UTC 0,2,4...）
  workflow_dispatch:
    inputs:
      fetch_limit:
        description: '1回で取得する法人番号数（補完/更新それぞれ）'
        default: '1000'
      emp_rounds:
        description: 'GAS判定を回す最大回数'
        default: '30'

concurrency:
  group: emp-pipeline
  cancel-in-progress: false   # 実行中の次は待機（二重取得防止）

env:
  HS_TOKEN: ${{ secrets.HS_TOKEN }}
  GAS_WEB_URL: ${{ secrets.GAS_WEB_URL || 'https://script.google.com/macros/s/AKfycbxnsq89breuqmvKm94wzFwlxsNB0qAFXr6RPMvO93BOSZr4VWPJG-ejdzkGcQe9XTjWQQ/exec' }}

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 状態復元（キャッシュ・カーソル）
        uses: actions/cache@v4
        with:
          path: |
            emp_cache_local.json
            emp_fetch_state.json
          key: emp-state-${{ github.run_id }}
          restore-keys: |
            emp-state-

      - name: 1) 年金機構取得（フェッチャ）
        run: |
          node emp_fetch_local.js \
            --fill --limit ${{ inputs.fetch_limit || '1000' }} \
            --update --limit ${{ inputs.fetch_limit || '1000' }}

      - name: 2) GAS判定（dryrun・未実行分ゼロまで）
        run: |
          rounds=${{ inputs.emp_rounds || '30' }}
          for i in $(seq 1 "$rounds"); do
            echo "--- emp $i ---"
            resp=$(curl -sS --max-time 580 "$GAS_WEB_URL?action=emp")
            echo "$resp" | head -c 2500; echo
            if echo "$resp" | grep -q '残っていません' && echo "$resp" | grep -q '1周しました'; then
              echo "判定完了（未実行分なし）"
              break
            fi
            sleep 2
          done

      - name: 3) ダッシュボード更新
        if: always()
        run: curl -sS "$GAS_WEB_URL?action=empstart" | head -c 400

      - name: サマリ
        if: always()
        run: |
          {
            echo "### 従業員数パイプライン"
            echo "- 実行: $(date -u +'%Y-%m-%d %H:%M UTC')"
            echo "- カーソル: $(cat emp_fetch_state.json 2>/dev/null || echo '(なし)')"
            echo "- キャッシュ件数: $(node -e "try{console.log(Object.keys(require('./emp_cache_local.json')).length)}catch(e){console.log(0)}")"
          } >> "$GITHUB_STEP_SUMMARY"
