name: 従業員数 適用（HubSpotへ実書き込み・要確認）

# dryrunで蓄積された「書き込みプレビュー_従業員数」をHubSpotへ実際に反映する。
# 承認後の作業専用。apply_confirm に yes と入力したときしか動かない。
on:
  workflow_dispatch:
    inputs:
      apply_confirm:
        description: '実書き込みしてよい場合は yes と入力'
        required: true
        default: ''

env:
  GAS_WEB_URL: ${{ secrets.GAS_WEB_URL || 'https://script.google.com/macros/s/AKfycbxnsq89breuqmvKm94wzFwlxsNB0qAFXr6RPMvO93BOSZr4VWPJG-ejdzkGcQe9XTjWQQ/exec' }}

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 確認
        run: |
          if [ "${{ inputs.apply_confirm }}" != "yes" ]; then
            echo "apply_confirm に yes が必要です（実書き込みのため二重確認）"; exit 1
          fi

      - name: '1) プレビュー適用（GAS action=empapply／事前に書込モードへ切替が必要）'
        run: |
          resp=$(curl -sS --max-time 580 "$GAS_WEB_URL?action=empapply")
          echo "$resp" | head -c 2500

      - name: 2) ダッシュボード更新
        if: always()
        run: curl -sS "$GAS_WEB_URL?action=empstart" | head -c 400
